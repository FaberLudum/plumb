[workspace]
members = ["crates/plumb-core", "crates/plumb-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
clap = { version = "4.6.5", features = ["derive"] }
ureq = "3.3.0"
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
