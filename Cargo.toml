[workspace]
members = ["crates/plumb-core", "crates/plumb-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
ureq = { version = "2", features = ["json"] }
assert_cmd = "2"
predicates = "3"
tempfile = "3"
